name: Build and Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        registry: restaurantyacrlananh.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build
      run: |
        docker build \
        -t restaurantyacrlananh.azurecr.io/auth:${{ github.sha }} \
        ./auth

    - name: Push
      run: |
        docker push \
        restaurantyacrlananh.azurecr.io/auth:${{ github.sha }}

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo '${{ secrets.KUBE_CONFIG }}' > ~/.kube/config

    - name: Deploy
      run: |

        kubectl set image \
        deployment/auth \
        auth=restaurantyacrlananh.azurecr.io/auth:${{ github.sha }} \
        -n restauranty

    - name: Verify
      run: |

        kubectl rollout status \
        deployment/auth \
        -n restauranty