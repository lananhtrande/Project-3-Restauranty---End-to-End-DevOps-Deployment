name: Build and Deploy

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

env:
  REGISTRY: restaurantyacrlananh.azurecr.io

jobs:

  detect:

    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:

    - uses: actions/checkout@v4

      with:
        fetch-depth: 2

    - id: detect

      run: |

        FILES=$(git diff --name-only HEAD~1 HEAD)

        CHANGED='[]'

        if echo "$FILES" | grep -q '^apps/backend/auth/'; then
          CHANGED=$(echo "$CHANGED" | jq -c '. + ["auth"]')
        fi

        if echo "$FILES" | grep -q '^apps/backend/items/'; then
          CHANGED=$(echo "$CHANGED" | jq -c '. + ["items"]')
        fi

        if echo "$FILES" | grep -q '^apps/backend/discounts/'; then
          CHANGED=$(echo "$CHANGED" | jq -c '. + ["discounts"]')
        fi

        if echo "$FILES" | grep -q '^apps/client/'; then
          CHANGED=$(echo "$CHANGED" | jq -c '. + ["client"]')
        fi

        echo "Detected services: $CHANGED"

        echo "services=$CHANGED" >> "$GITHUB_OUTPUT"

  build:

    needs: detect

    if: needs.detect.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:

      matrix:

        service:
          ${{ fromJson(needs.detect.outputs.services) }}

    steps:

    - uses: actions/checkout@v4

      with:
        fetch-depth: 0

    - name: Docker Login

      uses: docker/login-action@v3

      with:
        registry: ${{ env.REGISTRY }}

        username: ${{ secrets.ACR_USERNAME }}

        password: ${{ secrets.ACR_PASSWORD }}

    - name: Setup Buildx

      uses: docker/setup-buildx-action@v3

    - name: Select Build Context

      run: |

        if [ "${{ matrix.service }}" = "client" ]; then
          echo "DIR=apps/client" >> $GITHUB_ENV
        else
          echo "DIR=apps/backend/${{ matrix.service }}" >> $GITHUB_ENV
        fi

    - name: Build and Push

      uses: docker/build-push-action@v6

      with:

        context: ${{ env.DIR }}

        push: true

        platforms: linux/amd64,linux/arm64

        tags: |
          ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}

  deploy:

    needs:
      - detect
      - build

    if: needs.detect.outputs.services != '[]'

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

      with:
        fetch-depth: 0

    - name: Install yq

      run: |

        sudo wget \
        https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
        -O /usr/local/bin/yq

        sudo chmod +x /usr/local/bin/yq

    - name: Update Helm values

      run: |

        SERVICES='${{ needs.detect.outputs.services }}'

        echo "$SERVICES" \
        | jq -r '.[]' \
        | while read SERVICE
        do

          yq \
          -i \
          '.images.'"$SERVICE"'="${{ github.sha }}"' \
          helm/restauranty/values.yaml

        done

        cat helm/restauranty/values.yaml

    - name: Commit changes

      run: |

        git config \
        user.name \
        github-actions

        git config \
        user.email \
        github-actions@github.com

        git add \
        helm/restauranty/values.yaml

        git commit \
        -m \
        "deploy ${{ github.sha }}" \
        || true

    - name: Push changes

      run: |

        git push