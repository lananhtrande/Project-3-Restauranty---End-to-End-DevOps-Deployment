apiVersion: apps/v1
kind: Deployment
metadata:
  name: items
  namespace: restauranty

spec:
  replicas: 2
  selector:
    matchLabels:
      app: items
  template:
    metadata:
      labels:
        app: items
    spec:
      containers:
      - name: items
        image: {{ .Values.registry }}/items:{{ .Values.images.items }}
        envFrom:
        - secretRef:
            name: backend-secret
        ports:
        - containerPort: 3003

---
apiVersion: v1
kind: Service
metadata:
  name: items
  namespace: restauranty

spec:
  selector:
    app: items
  ports:
  - port: 3003
    targetPort: 3003