apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restauranty
  namespace: restauranty
  annotations:
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: restauranty-cert-tls

spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: restauranty.duckdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client
            port:
              number: 80
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: 3001
      - path: /api/discounts
        pathType: Prefix
        backend:
          service:
            name: discounts
            port:
              number: 3002
      - path: /api/items
        pathType: Prefix
        backend:
          service:
            name: items
            port:
              number: 3003