apiVersion: apps/v1
kind: Deployment
metadata:
  name: discounts
  namespace: restauranty

spec:
  replicas: 2
  selector:
    matchLabels:
      app: discounts
  template:
    metadata:
      labels:
        app: discounts
    spec:
      containers:
      - name: discounts
        image: restaurantyacrlananh.azurecr.io/discounts:latest
        ports:
        - containerPort: 3002
        envFrom:
        - secretRef:
            name: backend-secret

---
apiVersion: v1
kind: Service
metadata:
  name: discounts
  namespace: restauranty

spec:
  selector:
    app: discounts
  ports:
  - port: 3002
    targetPort: 3002