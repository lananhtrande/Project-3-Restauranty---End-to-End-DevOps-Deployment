apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: restauranty

spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: restaurantyacrlananh.azurecr.io/client:latest

---

apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: restauranty

spec:
  selector:
    app: client
  ports:
  - port: 80
    targetPort: 80